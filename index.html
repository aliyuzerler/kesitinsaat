// Kayan satır başlığı (clip reveal)
function MaskLine({ children, delay = 0, ready = true }: { children: React.ReactNode; delay?: number; ready?: boolean }) {
  return (
    <span className="block overflow-hidden pb-[0.08em] -mb-[0.08em]">
      <motion.span
        className="block"
        initial={{ y: "115%" }}
        animate={ready ? { y: "0%" } : { y: "115%" }}
        transition={{ duration: 1.1, delay, ease: easeExpo }}
      >{children}</motion.span>
    </span>
  );
}

// Scroll'a giren maske başlığı
function MaskInView({ children, delay = 0, className = "" }: { children: React.ReactNode; delay?: number; className?: string }) {
  return (
    <span className={"block overflow-hidden " + className}>
      <motion.span
        className="block"
        initial={{ y: "115%" }}
        whileInView={{ y: "0%" }}
        viewport={{ once: true, margin: "-10% 0px" }}
        transition={{ duration: 1, delay, ease: easeExpo }}
      >{children}</motion.span>
    </span>
  );
}

// Genel reveal sarmalayıcı
function Reveal({ children, delay = 0, y = 32, className = "" }: { children: React.ReactNode; delay?: number; y?: number; className?: string }) {
  return (
    <motion.div
      className={className}
      initial={{ opacity: 0, y }}
      whileInView={{ opacity: 1, y: 0 }}
      viewport={{ once: true, margin: "-8% 0px" }}
      transition={{ duration: 0.9, delay, ease: easeExpo }}
    >{children}</motion.div>
  );
}

// Section başlığı: mono etiket + dev maske başlık

// Mimari plan köşe işareti (+)
function Cross({ className = "" }: { className?: string }) {
  return (
    <span className={`absolute w-4 h-4 pointer-events-none text-ink ${className}`}>
      <span className="absolute left-1/2 top-0 bottom-0 w-px bg-current opacity-30 -translate-x-1/2" />

}

// Manyetik buton sarmalayıcı
function Magnetic({ children }: { children: React.ReactNode }) {
  const ref = useRef<HTMLDivElement>(null);
  const x = useSpring(useMotionValue(0), { stiffness: 220, damping: 16 });
  const y = useSpring(useMotionValue(0), { stiffness: 220, damping: 16 });
  return (
    <motion.div
      ref={ref}
      style={{ x, y }}
      className="inline-block"
      onMouseMove={(e: React.MouseEvent) => {
        const r = ref.current?.getBoundingClientRect();
        if (!r) return;
        x.set((e.clientX - (r.left + r.width / 2)) * 0.28);
        y.set((e.clientY - (r.top + r.height / 2)) * 0.28);
      }}
      onMouseLeave={() => { x.set(0); y.set(0); }}
    >{children}</motion.div>
  );
}

// Animasyonlu sayaç
function Stat({ value, suffix, label, delay = 0 }: { value: number; suffix: string; label: string; delay?: number }) {
  const ref = useRef<HTMLDivElement>(null);
  const inView = useInView(ref, { once: true, margin: "-10% 0px" });
  const mv = useMotionValue(0);
  const txt = useTransform(mv, (v: number) => Math.round(v).toLocaleString("tr-TR"));
  useEffect(() => {
    if (inView) {
      const c = animate(mv, value, { duration: 2, delay, ease: easeExpo });
      return () => c.stop();
    }
  }, [inView]);
  return (
    <div ref={ref} className="border-t border-line pt-4">
      <div className="font-x font-black text-4xl md:text-[3.4rem] leading-none">
        <motion.span>{txt}</motion.span><span className="text-clay">{suffix}</span>
      </div>
      <p className="mono text-[10px] tracking-[.25em] text-stone mt-3 uppercase">{label}</p>
    </div>
  );
}

/* ============================================================
   ÖZEL İMLEÇ
============================================================ */
function Cursor() {
  const [enabled, setEnabled] = useState(false);
  const [active, setActive] = useState(false);
  const [label, setLabel] = useState("");
  const x = useMotionValue(-100), y = useMotionValue(-100);
  const sx = useSpring(x, { stiffness: 650, damping: 45, mass: 0.5 });
  const sy = useSpring(y, { stiffness: 650, damping: 45, mass: 0.5 });

  useEffect(() => {
    if (!window.matchMedia("(pointer:fine) and (min-width:1024px)").matches) return;
    setEnabled(true);
    document.body.classList.add("has-cursor");
    const move = (e: MouseEvent) => { x.set(e.clientX); y.set(e.clientY); };
    const over = (e: MouseEvent) => {
      const el = (e.target as HTMLElement).closest?.("[data-cursor]") as HTMLElement | null;
      if (el) { setActive(true); setLabel(el.dataset.cursor || ""); }
      else { setActive(false); setLabel(""); }
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseover", over);
    return () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseover", over);
      document.body.classList.remove("has-cursor");
    };
  }, []);

  if (!enabled) return null;
  return (
    <React.Fragment>
      <motion.div style={{ x: sx, y: sy }} className="fixed top-0 left-0 z-[260] pointer-events-none">
        <motion.div
          animate={{ scale: active ? 0 : 1 }}
          className="w-2.5 h-2.5 -ml-[5px] -mt-[5px] rounded-full bg-paper mix-blend-difference"
        />
      </motion.div>
      <motion.div style={{ x: sx, y: sy }} className="fixed top-0 left-0 z-[259] pointer-events-none">
        <motion.div
          animate={{ scale: active ? 1 : 0, opacity: active ? 1 : 0 }}
          transition={{ duration: 0.35, ease: easeExpo }}
          className="w-20 h-20 -ml-10 -mt-10 rounded-full bg-clay text-ink flex items-center justify-center mono text-[10px] tracking-[.3em]"
        >{label}</motion.div>
      </motion.div>
    </React.Fragment>
  );
}

/* ============================================================
   PRELOADER
============================================================ */
function Preloader({ onReady, onGone }: { onReady: () => void; onGone: () => void }) {
  const [n, setN] = useState(0);
  const [out, setOut] = useState(false);
  useEffect(() => {
    const c = animate(0, 100, {
      duration: 1.2,
      ease: [0.65, 0, 0.35, 1],
      onUpdate: (v: number) => setN(Math.round(v)),
      onComplete: () => {
        setOut(true);
        onReady();
        setTimeout(onGone, 850);
      },
    });
    return () => c.stop();
  }, []);
  return (
    <motion.div
      className="fixed inset-0 z-[300] bg-ink text-paper flex flex-col justify-between p-6 md:p-10"
      animate={out ? { y: "-100%" } : { y: 0 }}
      transition={{ duration: 0.8, ease: [0.76, 0, 0.24, 1] }}
    >
      <div className="mono text-[10px] tracking-[.4em] uppercase flex justify-between text-paper/70">
        <span>Kesit Mimarlık & İnşaat</span>
        <span className="hidden sm:block">Est. 1998 — İstanbul</span>
      </div>
      <div className="flex items-end justify-between">
        <div className="font-x font-black leading-none text-[clamp(4rem,12vw,9rem)]">
          {n}<span className="text-clay">%</span>
        </div>
        <div className="mono text-[10px] tracking-[.4em] text-paper/50 pb-3">YÜKLENİYOR</div>
      </div>
      <div className="h-px w-full bg-paper/15 overflow-hidden">
        <div className="h-full bg-clay origin-left" style={{ transform: `scaleX(${n / 100})` }} />
      </div>
    </motion.div>
  );
}

function Projects({ onOpen }: { onOpen: (p: Project) => void }) {
  const FILTERS: ("Tümü" | Category)[] = ["Tümü", "Konut", "Ticari", "Kültür"];
  const [filter, setFilter] = useState<(typeof FILTERS)[number]>("Tümü");
  const filtered = filter === "Tümü" ? PROJECTS : PROJECTS.filter((p) => p.cat === filter);
  const left = filtered.filter((_, i) => i % 2 === 0);
  const right = filtered.filter((_, i) => i % 2 === 1);

  return (
    <section id="projeler" className="py-24 md:py-36">
      <div className="max-w-[1600px] mx-auto px-5 md:px-10 lg:px-14">
        <SectionHead
          no="03" tag="Seçili İşler" title="İŞLERİMİZ"
          right={
            <div className="flex flex-wrap gap-x-7 gap-y-3 mono text-[11px] tracking-[.25em] uppercase">
              {FILTERS.map((f) => (
                <button
                  key={f}
                  onClick={() => setFilter(f)}
                  className={`pb-1 border-b transition-colors ${filter === f ? "text-clay border-clay" : "text-stone border-transparent hover:text-ink"}`}
                >{f}</button>
              ))}
            </div>
          }
        />

        <div key={filter} className="flex flex-col lg:flex-row gap-12 lg:gap-8">
          <div className="lg:w-[58%] space-y-14 md:space-y-20">
            {left.map((p, i) => <ProjectCard key={p.id} p={p} idx={i} onOpen={onOpen} />)}
          </div>
          <div className="lg:w-[42%] space-y-14 md:space-y-20 lg:pt-40">
            {right.map((p, i) => <ProjectCard key={p.id} p={p} idx={i} onOpen={onOpen} />)}
          </div>
        </div>
      </div>
    </section>
  );
}

function ProjectDrawer({ project, onClose, onPick }: { project: Project | null; onClose: () => void; onPick: (id: number) => void }) {
  useEffect(() => {
    const esc = (e: KeyboardEvent) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  }, []);

  const idx = project ? PROJECTS.findIndex((p) => p.id === project.id) : 0;
  const prev = PROJECTS[(idx - 1 + PROJECTS.length) % PROJECTS.length];
  const next = PROJECTS[(idx + 1) % PROJECTS.length];

  return (
    <AnimatePresence>
      {project && (
        <div className="fixed inset-0 z-[120]">
          <motion.div
            className="absolute inset-0 bg-ink/70 backdrop-blur-sm"
            initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
            onClick={onClose}
          />
          <motion.aside
            className="absolute right-0 top-0 h-full w-full max-w-[640px] bg-ink text-paper overflow-y-auto overscroll-contain"
            initial={{ x: "100%" }} animate={{ x: 0 }} exit={{ x: "100%" }}
            transition={{ duration: 0.6, ease: easeExpo }}
          >
            <div className="p-6 md:p-10">
              <div className="flex items-center justify-between mb-8">
                <span className="mono text-[10px] tracking-[.35em] uppercase text-paper/50">
                  Proje — {String(idx + 1).padStart(2, "0")}/{String(PROJECTS.length).padStart(2, "0")}
                </span>
                <button onClick={onClose} className="p-2 -mr-2 hover:text-clay transition-colors" aria-label="Kapat">
                  <X size={24} />
                </button>
              </div>

              <motion.div key={project.id} initial={{ opacity: 0, y: 24 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.5, ease: easeExpo }}>
                <div className="overflow-hidden">
                  <img src={img(project.seed + "-hero", 1600, 1000)} alt={project.title} className="w-full aspect-[16/10] object-cover saturate-[.9]" />
                </div>

                <div className="mono text-[10px] tracking-[.3em] uppercase text-clay mt-8">{project.cat} — {project.year}</div>
                <h3 className="font-x font-black uppercase text-4xl md:text-5xl tracking-tight mt-3">{project.title}</h3>

                <div className="grid grid-cols-2 gap-x-8 mt-8">
                  {[
                    ["Konum", project.loc],
                    ["İnşa Alanı", project.area],
                    ["İşveren", project.client],
                    ["Durum", project.status],
                  ].map(([k, v]) => (
                    <div key={k} className="border-t border-paper/15 py-3">
                      <div className="mono text-[9px] tracking-[.3em] uppercase text-paper/40">{k}</div>
                      <div className="text-sm mt-1">{v}</div>
                    </div>
                  ))}
                </div>

                <p className="text-paper/65 leading-relaxed mt-8">{project.desc}</p>

                <div className="border-t border-paper/15 mt-8 pt-5">
                  <div className="mono text-[9px] tracking-[.3em] uppercase text-paper/40 mb-2">Malzeme Paleti</div>
                  <div className="mono text-[12px] tracking-[.12em] text-paper/80">{project.mat.join("  /  ")}</div>
                </div>

                <div className="overflow-hidden mt-10">
                  <img src={img(project.seed + "-b", 1200, 800)} alt={project.title + " detay"} loading="lazy" className="w-full aspect-[3/2] object-cover saturate-[.9]" />
                </div>

                {/* Önceki / Sonraki */}
                <div className="grid grid-cols-2 border-t border-paper/15 mt-10">
                  <button onClick={() => onPick(prev.id)} className="flex items-center gap-3 py-6 border-r border-paper/15 mono text-[10px] tracking-[.25em] uppercase text-paper/60 hover:text-clay transition-colors">
                    <ChevronLeft size={14} /> {prev.title}
                  </button>
                  <button onClick={() => onPick(next.id)} className="flex items-center justify-end gap-3 py-6 mono text-[10px] tracking-[.25em] uppercase text-paper/60 hover:text-clay transition-colors text-right">
                    {next.title} <ArrowRight size={14} />
                  </button>
                </div>
              </motion.div>
            </div>
          </motion.aside>
        </div>
      )}
    </AnimatePresence>
  );
}

/* ============================================================

============================================================ */
function Step({ i, title, desc }: { i: number; title: string; desc: string }) {
  const ref = useRef<HTMLDivElement>(null);
  const inView = useInView(ref, { once: true, margin: "-18% 0px" });
  return (
    <div ref={ref} className="grid grid-cols-[56px_1fr] md:grid-cols-[110px_1fr] gap-6 border-t border-line py-8 md:py-10">
      <motion.span
        initial={{ opacity: 0.12, y: 20 }}
        animate={inView ? { opacity: 1, y: 0 } : {}}
        transition={{ duration: 0.8, ease: easeExpo }}
        className={`font-x font-black leading-none text-3xl md:text-5xl transition-colors duration-500 ${inView ? "text-clay" : "text-ink/15"}`}
      >0{i + 1}</motion.span>
      <motion.div initial={{ opacity: 0, y: 24 }} animate={inView ? { opacity: 1, y: 0 } : {}} transition={{ duration: 0.8, delay: 0.1, ease: easeExpo }}>
        <h3 className="font-x font-extrabold uppercase text-lg md:text-2xl tracking-tight mb-3">{title}</h3>
        <p className="text-stone leading-relaxed max-w-lg">{desc}</p>
      </motion.div>
    </div>
  );
}

/* ============================================================
   İLETİŞİM — CTA üçlüsü + teklif formu (koyu section)
============================================================ */
function Field({ label, id, children }: { label: string; id: string; children: React.ReactNode }) {
  return (
    <div>
      <label htmlFor={id} className="mono text-[9px] tracking-[.3em] uppercase text-paper/40 block mb-1">{label}</label>
      {children}
    </div>
  );
}

const inputCls = "w-full bg-transparent border-b border-paper/20 focus:border-clay py-3 text-paper placeholder:text-paper/25 transition-colors duration-300";

function Contact({ notify }: { notify: (msg: string) => void }) {
  const [form, setForm] = useState({ name: "", phone: "", email: "", type: "Konut", area: "", msg: "" });
  const [errors, setErrors] = useState<{ name?: string; phone?: string }>({});
  const [sent, setSent] = useState(false);

  const set = (k: string) => (e: React.ChangeEvent<HTMLInputElement | HTMLTextAreaElement | HTMLSelectElement>) =>
    setForm({ ...form, [k]: e.target.value });

  const submit = (e: React.FormEvent) => {
    e.preventDefault();
    const errs: typeof errors = {};
    if (form.name.trim().length < 3) errs.name = "Lütfen adınızı yazın.";
    if (form.phone.replace(/\D/g, "").length < 10) errs.phone = "Geçerli bir telefon girin.";
    setErrors(errs);
    if (Object.keys(errs).length) return;
    try {
      const prev = JSON.parse(localStorage.getItem("kesit-leads") || "[]");
      localStorage.setItem("kesit-leads", JSON.stringify([...prev, { ...form, at: new Date().toISOString() }]));
    } catch (_) { /* sessiz geç */ }
    setSent(true);
    notify("Talebiniz alındı — 24 saat içinde dönüş yapacağız.");
  };

  return (
    <section id="iletisim" className="bg-ink text-paper py-24 md:py-36 relative">
      <Cross className="right-10 top-10 text-paper" />
      <div className="max-w-[1600px] mx-auto px-5 md:px-10 lg:px-14">
        <div className="mono text-[10px] tracking-[.4em] uppercase text-paper/50 mb-8 flex items-center gap-3">
          <span className="w-9 h-px bg-clay inline-block" />( 05 ) — İletişim
        </div>
        <h2 className="font-x font-black uppercase leading-[0.95] tracking-tight text-[clamp(2.4rem,6vw,5.5rem)]">
          <MaskInView>BİR SONRAKİ PROJENİZİ</MaskInView>
          <MaskInView delay={0.1}><span className="text-clay">BİRLİKTE İNŞA EDELİM</span></MaskInView>
        </h2>

        <div className="grid grid-cols-12 gap-x-8 gap-y-16 mt-16 md:mt-24">
          {/* Sol — bilgiler + aksiyonlar */}
          <div className="col-span-12 lg:col-span-5">
            <p className="text-paper/55 leading-relaxed max-w-md mb-12">
              Projenizin ilk 30 dakikalık ön değerlendirmesi ücretsizdir.
              Formu doldurun ya da doğrudan ulaşın — mimarımız, şantiye şefimizle aynı masada oturarak
              size döneriz.
            </p>
            {[
              { icon: <MapPin size={15} />, k: "Stüdyo", v: "Nispetiye Cad. Levent İş Merkezi No:12, Kat 6 — İstanbul" },
              { icon: <Phone size={15} />, k: "Telefon", v: "+90 212 348 26 70" },
              { icon: <Mail size={15} />, k: "E-posta", v: "info@kesitmimarlik.com" },
              { icon: <Clock size={15} />, k: "Mesai", v: "Pzt — Cum, 09:00 / 18:30" },
            ].map((r) => (
              <div key={r.k} className="flex gap-4 border-t border-paper/12 py-4 items-start">
                <span className="text-clay mt-0.5">{r.icon}</span>
                <div>
                  <div className="mono text-[9px] tracking-[.3em] uppercase text-paper/40">{r.k}</div>
                  <div className="text-sm mt-1">{r.v}</div>
                </div>
              </div>
            ))}
            <div className="flex flex-wrap gap-4 mt-10">
              <a href="tel:+902123482670" className="btn btn-ghost-light"><Phone size={14} /> Bizi Arayın</a>
              <a href={WA_LINK} target="_blank" rel="noreferrer" className="btn btn-ghost-light"><MessageCircle size={14} /> WhatsApp'tan Ulaşın</a>
            </div>
          </div>

          {/* Sağ — form */}
          <div className="col-span-12 lg:col-span-7">
            <AnimatePresence mode="wait">
              {!sent ? (
                <motion.form
                  key="form"
                  onSubmit={submit}
                  initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -16 }}
                  transition={{ duration: 0.5, ease: easeExpo }}
                  className="border border-paper/15 p-6 md:p-10"
                  noValidate
                >
                  <div className="mono text-[10px] tracking-[.35em] uppercase text-paper/50 mb-8">Teklif Talebi</div>
                  <div className="grid md:grid-cols-2 gap-x-8 gap-y-7">
                    <Field label="Ad Soyad *">
                      <input id="lead-name" value={form.name} onChange={set("name")} placeholder="Adınız Soyadınız" className={inputCls} />
                      {errors.name && <p className="mono text-[10px] text-clay mt-1.5 tracking-widest">{errors.name}</p>}
                    </Field>
                    <Field label="Telefon *">
                      <input value={form.phone} onChange={set("phone")} placeholder="0 (5__) ___ __ __" className={inputCls} inputMode="tel" />
                      {errors.phone && <p className="mono text-[10px] text-clay mt-1.5 tracking-widest">{errors.phone}</p>}
                    </Field>
                    <Field label="E-posta">
                      <input value={form.email} onChange={set("email")} placeholder="ornek@sirket.com" className={inputCls} inputMode="email" />
                    </Field>
                    <Field label="Proje Türü">
                      <div className="relative">
                        <select value={form.type} onChange={set("type")} className={inputCls + " appearance-none pr-8"} style={{ colorScheme: "dark" }}>
                          <option>Konut</option><option>Ticari</option><option>Kültür</option><option>Restorasyon</option><option>Diğer</option>
                        </select>
                        <ChevronDown size={15} className="absolute right-1 top-1/2 -translate-y-1/2 text-paper/40 pointer-events-none" />
                      </div>
                    </Field>
                    <div className="md:col-span-2">
                      <Field label="Tahmini İnşa Alanı (m²)">
                        <input value={form.area} onChange={set("area")} placeholder="Örn. 1.200" className={inputCls} inputMode="numeric" />
                      </Field>
                    </div>
                    <div className="md:col-span-2">
                      <Field label="Projenizi Kısaca Anlatın">
                        <textarea value={form.msg} onChange={set("msg")} rows={4} placeholder="Arazi durumu, beklentileriniz, takvim..." className={inputCls + " resize-none"} />
                      </Field>
                    </div>
                  </div>
                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 mt-10">
                    <p className="mono text-[9px] tracking-[.2em] uppercase text-paper/35 max-w-xs leading-relaxed">
                      Bilgileriniz yalnızca teklif değerlendirmesi için kullanılır.
                    </p>
                    <Magnetic>
                      <button type="submit" className="btn !bg-paper !text-ink hover:!bg-clay">Gönder <Send size={14} /></button>
                    </Magnetic>
                  </div>
                </motion.form>
              ) : (
                <motion.div
                  key="ok"
                  initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }}
                  transition={{ duration: 0.5, ease: easeExpo }}
                  className="border border-paper/15 p-10 md:p-14 flex flex-col items-start gap-6"
                >
                  <span className="w-14 h-14 rounded-full border border-clay flex items-center justify-center text-clay">
                    <Check size={24} />
                  </span>
                  <h3 className="font-x font-extrabold uppercase text-3xl tracking-tight">Talebiniz alındı.</h3>
                  <p className="text-paper/60 leading-relaxed max-w-md">
                    Sayın {form.name.split(" ")[0]}, proje özetiniz ekibimize iletildi.
                    24 saat içinde {form.phone} numarasından size ulaşacağız.
                  </p>
                  <button
                    onClick={() => { setSent(false); setForm({ name: "", phone: "", email: "", type: "Konut", area: "", msg: "" }); }}
                    className="btn btn-ghost-light"
                  >Yeni Talep Oluştur</button>
                </motion.div>
              )}
            </AnimatePresence>
          </div>
        </div>
      </div>
    </section>
  );
}

function IstanbulClock() {
  const [t, setT] = useState("");
  useEffect(() => {
    const f = () => setT(new Date().toLocaleTimeString("tr-TR", { timeZone: "Europe/Istanbul", hour: "2-digit", minute: "2-digit", second: "2-digit" }));
    f();
    const id = setInterval(f, 1000);
    return () => clearInterval(id);
  }, []);
  return <span className="tabular-nums">{t}</span>;
}

/* ============================================================

function Toasts({ items }: { items: { id: number; msg: string }[] }) {

      <AnimatePresence>
        {items.map((t) => (

/* ============================================================
   APP — Lenis, state ve kompozisyon
============================================================ */
function App() {
  const [showPre, setShowPre] = useState(true);
  const [ready, setReady] = useState(false);
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [activeProject, setActiveProject] = useState<Project | null>(null);
  const [toasts, setToasts] = useState<{ id: number; msg: string }[]>([]);
  const lenisRef = useRef<any>(null);

  const notify = (msg: string) => {
    const id = Date.now() + Math.random();
    setToasts((t) => [...t, { id, msg }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4200);
  };

  // Lenis yumuşak kaydırma + anchor navigasyonu
  useEffect(() => {
    let lenis: any = null;
    try {
      lenis = new Lenis({ duration: 1.15, smoothWheel: true });
      const raf = (t: number) => { lenis?.raf(t); requestAnimationFrame(raf); };
      requestAnimationFrame(raf);
    } catch (_) { /* Lenis yoksa native kaydırma */ }
    lenisRef.current = lenis;

    const onScrollTo = (e: Event) => {
      const id = (e as CustomEvent).detail as string;
      const el = document.getElementById(id);
      if (!el) return;
      if (lenis) lenis.scrollTo(el, { offset: -64, duration: 1.4 });
      else el.scrollIntoView({ behavior: "smooth" });
    };
    window.addEventListener("app:scrollto", onScrollTo);
    return () => {
      window.removeEventListener("app:scrollto", onScrollTo);
      lenis?.destroy();
    };
  }, []);

  // Header scroll durumu
  useEffect(() => {
    const f = () => setScrolled(window.scrollY > 50);
    f();
    window.addEventListener("scroll", f, { passive: true });
    return () => window.removeEventListener("scroll", f);
  }, []);

  // Menü / panel açıkken kaydırmayı kilitle
  useEffect(() => {
    const lock = menuOpen || !!activeProject;
    document.body.style.overflow = lock ? "hidden" : "";
    if (lock) lenisRef.current?.stop?.(); else lenisRef.current?.start?.();
  }, [menuOpen, activeProject]);

  return (
    <React.Fragment>
      {showPre && (
        <Preloader onReady={() => setReady(true)} onGone={() => setShowPre(false)} />
      )}
      <Cursor />
      <Header scrolled={scrolled} menuOpen={menuOpen} setMenuOpen={setMenuOpen} />
      <MobileMenu open={menuOpen} setMenuOpen={setMenuOpen} />
      <main>
        <Hero ready={ready} />
        <Marquee />
        <About />
        <Services />
        <Projects onOpen={setActiveProject} />
        <Process />
        <Trust />
        <Contact notify={notify} />
      </main>
      <Footer />
      <ProjectDrawer
        project={activeProject}
        onClose={() => setActiveProject(null)}
        onPick={(id: number) => setActiveProject(PROJECTS.find((p) => p.id === id) || null)}
      />
      <Toasts items={toasts} />
    </React.Fragment>
  );
}

createRoot(document.getElementById("root")!).render(<App />);
</script>
